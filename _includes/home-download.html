<section class="launch" id="download">

  <h2 class="launch-title">Download Animaquina.</h2>

    <a href="{{ site.download-url | default: '#download' }}" class="btn btn--ink">Download <span>&rarr;</span></a>

    {% if site.github-url %}<a href="{{site.github-url}}" target="_blank" rel="noopener noreferrer" class="btn btn--ghost">GitHub <span>&#8599;</span></a>{% endif %}
  </div>
</section>
