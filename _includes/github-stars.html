{% if site.github-url %}
{% assign gh_parts = site.github-url | remove: 'https://github.com/' | split: '/' %}
<a class="gh-tag" href="{{site.github-url}}" target="_blank" rel="noopener noreferrer" data-gh-repo="{{gh_parts[0]}}/{{gh_parts[1]}}">
    <span class="gh-tag__label">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        GitHub
    </span>
    <span class="gh-tag__count" hidden>
        <span aria-hidden="true">&#9733;</span> <span data-gh-stars></span><span class="is-sr-only"> stars</span>
    </span>
</a>
<script>
    (function () {
        /* Progressive: the link works without the count. Unauthenticated GitHub API, 60 requests/hour per visitor. */
        var tags = document.querySelectorAll('[data-gh-repo]');
        if (!tags.length || !window.fetch) return;
        fetch('https://api.github.com/repos/' + tags[0].getAttribute('data-gh-repo'))
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (repo) {
                if (!repo || typeof repo.stargazers_count !== 'number') return;
                for (var i = 0; i < tags.length; i++) {
                    tags[i].querySelector('[data-gh-stars]').textContent = repo.stargazers_count.toLocaleString('en-US');
                    tags[i].querySelector('.gh-tag__count').hidden = false;
                }
            })
            .catch(function () {});
    })();
</script>
{% endif %}
